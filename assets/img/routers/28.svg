<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edeff3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0a0e18" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- stand -->
  <path d="M133 230 h74 a12 12 0 0 1 12 12 v8 h-98 v-8 a12 12 0 0 1 12-12z" fill="#dfe3e9"/>
  <ellipse cx="170" cy="250" rx="52" ry="5" fill="#0a0e18" opacity="0.18"/>

  <!-- body -->
  <rect x="28" y="20" width="284" height="212" rx="30" fill="url(#body)"
        stroke="#dde1e8" stroke-width="2" filter="url(#soft)"/>

  <!-- status LED row -->
  <g fill="#b3bac5">
    <circle cx="66" cy="52" r="2.6"/><circle cx="90" cy="52" r="2.6"/>
    <circle cx="122" cy="52" r="2.2"/><circle cx="136" cy="52" r="2.2"/>
    <circle cx="150" cy="52" r="2.2"/><circle cx="164" cy="52" r="2.2"/>
    <circle cx="188" cy="52" r="2.6"/><circle cx="212" cy="52" r="2.6"/>
    <circle cx="236" cy="52" r="2.6"/><circle cx="262" cy="52" r="2.6"/>
    <circle cx="282" cy="52" r="2.6"/>
  </g>
  <rect x="118" y="59" width="50" height="1.6" rx="0.8" fill="#ccd2da"/>

  <!-- CloudMesh mark, bottom left -->
  <g fill="none" stroke="#9aa2ae" stroke-width="3" stroke-linecap="round">
    <path d="M64 196 a9 9 0 1 1 9 9 a9 9 0 1 1 -9 -9"/>
  </g>
  <g fill="#8f97a4" font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="196" font-size="13" font-weight="700" letter-spacing="1.5">CLOUD</text>
    <text x="90" y="210" font-size="12" letter-spacing="3">MESH</text>
  </g>

  <!-- NetComm mark, bottom right -->
  <g fill="none" stroke="#6c7480" stroke-width="3" stroke-linecap="round">
    <path d="M182 200 a14 14 0 0 1 24 0"/>
    <path d="M187 206 a8 8 0 0 1 14 0"/>
  </g>
  <circle cx="194" cy="211" r="2.6" fill="#6c7480"/>
  <text x="212" y="212" font-size="19" font-weight="700" fill="#6c7480"
        font-family="Arial, Helvetica, sans-serif">NetComm</text>
</svg>
