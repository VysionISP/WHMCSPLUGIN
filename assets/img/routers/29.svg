    <rect x="104" y="240" width="100" height="21" rx="10" fill="url(#band29)"/>
    <rect x="111" y="258" width="86" height="9" rx="4.5" fill="#5b626e"/>
  </g>
  <g fill="none" stroke="#a6adb9" stroke-width="2.4" stroke-linecap="round">
    <path d="M144 190 a7 7 0 1 1 7 7 a7 7 0 1 1 -7 -7"/>
  </g>
  <text x="132" y="216" font-size="9.5" font-weight="700" letter-spacing="1"
        fill="#9aa2ae" font-family="Arial, Helvetica, sans-serif">CLOUD MESH</text>

  <ellipse cx="180" cy="276" rx="120" ry="6" fill="#0a0e18" opacity="0.15"/>
