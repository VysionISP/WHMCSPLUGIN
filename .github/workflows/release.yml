name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          coverage: none

      - name: Syntax check all PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify tag matches VERSION file
        run: |
          CODE_VERSION=$(awk '{print $1; exit}' modules/servers/virtutel_nbn/VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($CODE_VERSION)." >&2
            echo "Update modules/servers/virtutel_nbn/VERSION before tagging." >&2
            exit 1
          fi

      - name: Build package ZIP
        run: ./build.sh

      - name: Create GitHub Release with ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Virtutel NBN suite $GITHUB_REF_NAME" \
            --generate-notes
