name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Syntax check
        run: |
          find modules -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Install dependencies
        working-directory: modules/servers/virtutelnbn
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        working-directory: modules/servers/virtutelnbn
        run: ./vendor/bin/phpunit
